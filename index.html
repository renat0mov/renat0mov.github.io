<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const menuToggle = document.querySelector(".menu-toggle");
        const mobileMenu = document.getElementById("mobileMenu");
        const closeMenu = document.querySelector(".close-menu");

        menuToggle.addEventListener("click", () => {
            mobileMenu.style.display = "flex";
        });

        closeMenu.addEventListener("click", () => {
            mobileMenu.style.display = "none";
        });

        // The grid loops carry no autoplay attribute on purpose. loading="lazy"
        // on <video> only defers autoplay in Chrome 148+; Safari and Firefox
        // would still download all five up front, which is the whole problem we
        // are solving. Starting playback here means nothing is fetched until the
        // tile is actually on screen, in every browser. With JS off, the poster
        // stays put and the page still looks right.
        const loops = document.querySelectorAll("video.hover-img");
        const MARGIN = 200;

        // play() rejects under iOS Low Power Mode, and there is nothing to fix
        // when it does — the poster frame is the fallback and looks fine.
        const start = (video) => video.play().catch(() => {});

        const nearViewport = (el) => {
            const r = el.getBoundingClientRect();
            return r.bottom > -MARGIN && r.top < window.innerHeight + MARGIN;
        };

        const playWhatIsOnScreen = () => {
            if (document.visibilityState !== "visible") return;
            loops.forEach((video) => {
                if (nearViewport(video)) start(video);
            });
        };

        if ("IntersectionObserver" in window) {
            const watcher = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) start(entry.target);
                    else entry.target.pause();
                });
            }, { rootMargin: MARGIN + "px" });

            loops.forEach((video) => watcher.observe(video));
        } else {
            playWhatIsOnScreen();
        }

        // Open the site in a background tab and the observer never fires: Chrome
        // pauses the rendering pipeline that computes intersections, so switching
        // to that tab would show five frozen posters. Re-check on the way back.
        document.addEventListener("visibilitychange", playWhatIsOnScreen);
    });
</script>
